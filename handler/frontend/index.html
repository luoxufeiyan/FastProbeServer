<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS Status Probe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .offline-row { background-color: #ffeaea !important; color: #a00 !important; }
        .offline-row td { background-color: transparent !important; }
        .progress { height: 1.2rem; }
        .view-section { display: none; }
        .active-section { display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4 text-center">VPS Server Status</h2>

    <!-- Setup View -->
    <div id="setup-view" class="view-section">
        <div class="card mx-auto" style="max-width: 500px;">
            <div class="card-header bg-primary text-white">Initial Setup</div>
            <div class="card-body">
                <form id="setup-form">
                    <div class="mb-3">
                        <label class="form-label">DB Host</label>
                        <input type="text" class="form-control" id="db_host" value="127.0.0.1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">DB Port</label>
                        <input type="text" class="form-control" id="db_port" value="3306" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">DB User</label>
                        <input type="text" class="form-control" id="db_user" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">DB Password</label>
                        <input type="password" class="form-control" id="db_password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">DB Name</label>
                        <input type="text" class="form-control" id="db_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Table Prefix</label>
                        <input type="text" class="form-control" id="db_prefix" value="vps_" required>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <label class="form-label">Admin Username</label>
                        <input type="text" class="form-control" id="admin_user" value="admin" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Admin Password</label>
                        <input type="password" class="form-control" id="admin_pass" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">History Snapshot Interval (Minutes)</label>
                        <input type="number" class="form-control" id="snapshot_mins" value="5" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Initialize</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Status View -->
    <div id="status-view" class="view-section">
        <div class="text-end mb-3">
            <button class="btn btn-sm btn-outline-secondary" onclick="showAdminLogin()">Admin Panel</button>
        </div>
        <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table table-hover table-borderless align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Status</th>
                        <th>Name</th>
                        <th>Location</th>
                        <th>Uptime</th>
                        <th style="width: 15%">CPU</th>
                        <th style="width: 15%">RAM</th>
                        <th style="width: 15%">Disk</th>
                        <th>Network (Rx|Tx)</th>
                    </tr>
                </thead>
                <tbody id="nodes-tbody">
                    <!-- Data rendered here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Admin Login View -->
    <div id="login-view" class="view-section">
        <div class="card mx-auto" style="max-width: 400px;">
            <div class="card-header bg-secondary text-white">Admin Login</div>
            <div class="card-body">
                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="login_user" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="login_pass" required>
                    </div>
                    <button type="submit" class="btn btn-secondary w-100 mb-2">Login</button>
                    <button type="button" class="btn btn-link w-100" onclick="showStatusView()">Back to Status</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard View -->
    <div id="admin-view" class="view-section">
        <div class="d-flex justify-content-between mb-3">
            <h4>Admin Dashboard</h4>
            <button class="btn btn-outline-secondary" onclick="showStatusView()">Back to Status</button>
        </div>
        
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">Add New Node</div>
            <div class="card-body">
                <form id="add-node-form" class="row g-3">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="node_name" placeholder="Name" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="node_loc" placeholder="Location">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="node_secret" placeholder="Secret Key" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="node_admin_only">
                            <label class="form-check-label">Admin Only</label>
                        </div>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-success w-100">Add</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Location</th>
                        <th>Secret Key</th>
                        <th>Admin Only</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="admin-nodes-tbody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    // Utility functions
    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag])
        );
    }

    function formatBytes(bytes, decimals = 2) {
        if (!+bytes) return '0 B';
        const k = 1024, dm = decimals < 0 ? 0 : decimals;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

    function formatUptime(seconds) {
        if (!seconds) return '-';
        const d = Math.floor(seconds / (3600*24));
        const h = Math.floor(seconds % (3600*24) / 3600);
        return d > 0 ? `${d}d ${h}h` : `${h}h`;
    }

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-section'));
        document.getElementById(viewId).classList.add('active-section');
    }

    // App State
    let isSetup = false;
    let pollInterval = null;

    // Initialization check
    async function checkSetup() {
        try {
            const res = await fetch('/api/check-setup');
            const data = await res.json();
            isSetup = data.is_setup;
            if (isSetup) {
                showStatusView();
            } else {
                switchView('setup-view');
            }
        } catch (e) { console.error("Error checking setup", e); }
    }

    // Setup Form
    document.getElementById('setup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            db_host: document.getElementById('db_host').value,
            db_port: document.getElementById('db_port').value,
            db_user: document.getElementById('db_user').value,
            db_password: document.getElementById('db_password').value,
            db_name: document.getElementById('db_name').value,
            db_prefix: document.getElementById('db_prefix').value,
            admin_user: document.getElementById('admin_user').value,
            admin_pass: document.getElementById('admin_pass').value,
            snapshot_mins: parseInt(document.getElementById('snapshot_mins').value) || 5
        };
        const res = await fetch('/api/setup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            alert('Setup successful!');
            checkSetup();
        } else {
            alert('Setup failed: ' + await res.text());
        }
    });

    // Polling Status
    function showStatusView() {
        switchView('status-view');
        fetchStatus();
        if(!pollInterval) {
            pollInterval = setInterval(fetchStatus, 2000);
        }
    }

    async function fetchStatus() {
        if (!document.getElementById('status-view').classList.contains('active-section')) return;
        try {
            const res = await fetch('/api/status');
            const data = await res.json() || [];
            renderStatusTable(data);
        } catch (e) { console.error("Error fetching status", e); }
    }

    function renderStatusTable(nodes) {
        const tbody = document.getElementById('nodes-tbody');
        tbody.innerHTML = '';
        nodes.forEach(n => {
            if (n.is_admin_only) return; // Hide admin only nodes from public status
            
            const tr = document.createElement('tr');
            if (!n.is_online) tr.className = 'offline-row';

            const cpuPct = n.is_online ? n.cpu.toFixed(1) : 0;
            const memPct = (n.is_online && n.mem_total) ? ((n.mem_used / n.mem_total) * 100).toFixed(1) : 0;
            const diskPct = (n.is_online && n.disk_total) ? ((n.disk_used / n.disk_total) * 100).toFixed(1) : 0;

            const memStr = n.is_online ? `${formatBytes(n.mem_used)} / ${formatBytes(n.mem_total)}` : '-';
            const diskStr = n.is_online ? `${formatBytes(n.disk_used)} / ${formatBytes(n.disk_total)}` : '-';
            const netStr = n.is_online ? `↓ ${formatBytes(n.net_rx)}/s | ↑ ${formatBytes(n.net_tx)}/s` : '-';
            const statusBadge = n.is_online ? `<span class="badge bg-success">Online</span>` : `<span class="badge bg-danger">Offline</span>`;

            tr.innerHTML = `
                <td>${statusBadge}</td>
                <td class="fw-bold">${escapeHTML(n.name)}</td>
                <td>${escapeHTML(n.location) || '-'}</td>
                <td>${n.is_online ? formatUptime(n.uptime) : '-'}</td>
                <td>
                    <div class="d-flex justify-content-between small mb-1"><span>${cpuPct}%</span></div>
                    <div class="progress"><div class="progress-bar ${cpuPct > 80 ? 'bg-danger' : 'bg-info'}" style="width: ${cpuPct}%"></div></div>
                </td>
                <td>
                    <div class="d-flex justify-content-between small mb-1"><span>${memStr}</span></div>
                    <div class="progress"><div class="progress-bar ${memPct > 80 ? 'bg-danger' : 'bg-warning'}" style="width: ${memPct}%"></div></div>
                </td>
                <td>
                    <div class="d-flex justify-content-between small mb-1"><span>${diskStr}</span></div>
                    <div class="progress"><div class="progress-bar ${diskPct > 80 ? 'bg-danger' : 'bg-success'}" style="width: ${diskPct}%"></div></div>
                </td>
                <td class="small font-monospace">${netStr}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Admin
    function showAdminLogin() {
        switchView('login-view');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            body: JSON.stringify({
                user: document.getElementById('login_user').value,
                pass: document.getElementById('login_pass').value
            })
        });
        if (res.ok) {
            loadAdminDashboard();
        } else {
            alert('Login failed');
        }
    });

    async function loadAdminDashboard() {
        switchView('admin-view');
        try {
            const res = await fetch('/api/admin/nodes');
            if (res.status === 403) {
                alert("Session expired");
                showAdminLogin();
                return;
            }
            const nodes = await res.json() || [];
            const tbody = document.getElementById('admin-nodes-tbody');
            tbody.innerHTML = '';
            nodes.forEach(n => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${n.id}</td>
                    <td>${escapeHTML(n.name)}</td>
                    <td>${escapeHTML(n.location)}</td>
                    <td><code>${escapeHTML(n.secret)}</code></td>
                    <td>${n.is_admin_only ? 'Yes' : 'No'}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteNode(${n.id})">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) { console.error(e); }
    }

    document.getElementById('add-node-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById('node_name').value,
            location: document.getElementById('node_loc').value,
            secret: document.getElementById('node_secret').value,
            is_admin_only: document.getElementById('node_admin_only').checked
        };
        await fetch('/api/admin/nodes', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        document.getElementById('add-node-form').reset();
        loadAdminDashboard();
    });

    async function deleteNode(id) {
        if(!confirm('Are you sure?')) return;
        await fetch(`/api/admin/nodes/${id}`, { method: 'DELETE' });
        loadAdminDashboard();
    }

    // Init
    checkSetup();

</script>
</body>
</html>
